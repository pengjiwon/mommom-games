<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="10초 영수증 뽑기">
<meta property="og:description" content="10초 동안 영수증을 얼마나 길게 뽑을 수 있을까? 롯데마트 쿠폰은 맘맘에서!">
<meta name="twitter:card" content="summary">
<style>*{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
</head>
<body>
<title>영수증 뽑기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;600;800&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* Layout: one-screen arcade — HUD on top, receipt printer hanging a live thermal strip down the middle, result printed as a receipt card */
:root {
  --floor: #e3ece6;        /* mart floor mint */
  --floor-line: #d2dfd7;
  --machine: #2a2f35;      /* printer body */
  --paper: #fffef9;        /* thermal paper */
  --ink: #2b2f36;
  --ink-soft: #7b8189;
  --stamp: #e0443e;        /* coupon stamp red, used sparingly */
  --mark: #ffd84a;         /* highlighter */
  --font-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-receipt: "Nanum Gothic Coding", "D2Coding", ui-monospace, monospace;
}
html, body { height: 100%; }
body {
  background: var(--floor);
  background-image: repeating-linear-gradient(90deg, transparent 0 63px, var(--floor-line) 63px 64px),
                    repeating-linear-gradient(0deg, transparent 0 63px, var(--floor-line) 63px 64px);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
}
.app {
  height: 100%;
  display: flex; flex-direction: column;
  max-width: 480px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 0;
  box-sizing: border-box;
}
.hud { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hud-box {
  background: var(--paper); border-radius: 12px; padding: 8px 14px 10px;
  box-shadow: 0 1px 0 rgba(0,0,0,.06);
  display: flex; flex-direction: column; gap: 2px;
}
.hud-label { font-size: 12px; font-weight: 600; color: var(--ink-soft); letter-spacing: .02em; }
.hud-val { font-family: var(--font-display); font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.hud-val small { font-size: 18px; margin-left: 2px; }
.hud-box.warn .hud-val { color: var(--stamp); }
.title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 12px 2px 10px; }
.title-row h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; letter-spacing: -.01em; }
.best { font-size: 12px; color: var(--ink-soft); font-weight: 600; font-variant-numeric: tabular-nums; }

.stage { position: relative; flex: 1; min-height: 0; touch-action: none; cursor: grab; }
.stage:active { cursor: grabbing; }
.stage:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; border-radius: 12px; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.printer {
  position: absolute; left: 50%; top: 0; transform: translateX(-50%);
  width: min(320px, 92%); height: 58px; border-radius: 14px 14px 8px 8px;
  background: var(--machine);
  box-shadow: 0 6px 0 #1b1f23, 0 10px 18px rgba(0,0,0,.18);
  pointer-events: none;
}
.printer::after { /* paper slot */
  content: ""; position: absolute; left: 7%; right: 7%; bottom: 8px; height: 5px;
  background: #101316; border-radius: 3px;
}
.printer .led { position: absolute; top: 12px; left: 16px; width: 8px; height: 8px; border-radius: 50%; background: #59605f; }
.printer.on .led { background: #41d07a; box-shadow: 0 0 8px #41d07a; }
.printer .brand { position: absolute; top: 8px; right: 16px; font: 700 11px var(--font-receipt); color: #9aa1a8; letter-spacing: .12em; }

.hint {
  position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
  background: var(--ink); color: var(--paper);
  font-weight: 800; font-size: 15px; padding: 11px 18px; border-radius: 999px;
  display: flex; align-items: center; gap: 8px; white-space: nowrap;
  pointer-events: none;
  animation: bob 1.1s ease-in-out infinite;
}
.hint svg { width: 18px; height: 18px; }
@keyframes bob { 50% { transform: translate(-50%, 6px); } }

/* result sheet */
.sheet {
  position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center;
  background: rgba(30, 36, 40, .45);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 5;
}
.card {
  width: 100%; max-width: 380px; margin-bottom: 4px;
  background: var(--paper); color: var(--ink);
  font-family: var(--font-receipt);
  padding: 22px 22px 18px; position: relative;
  /* torn receipt edges */
  --tooth: 8px;
  -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/var(--tooth) 51% repeat-x,
                conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top/var(--tooth) 51% repeat-x;
          mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom/var(--tooth) 51% repeat-x,
                conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top/var(--tooth) 51% repeat-x;
  animation: rise .45s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
.card .c-head { text-align: center; font-weight: 700; font-size: 13px; letter-spacing: .1em; color: var(--ink-soft); }
.card .dash { border: 0; border-top: 1.5px dashed #c9ccd0; margin: 12px 0; }
.card .c-big { text-align: center; font-family: var(--font-display); font-size: 64px; line-height: 1; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.card .c-big small { font-size: 28px; }
.card .c-rank { text-align: center; font-family: var(--font-body); font-weight: 800; font-size: 17px; }
.card .c-rank mark { background: linear-gradient(transparent 55%, var(--mark) 55%); color: inherit; padding: 0 3px; }
.card .row { display: flex; justify-content: space-between; font-size: 14px; line-height: 1.9; font-variant-numeric: tabular-nums; }
.card .row b { font-weight: 700; }
.stampmark {
  position: absolute; right: 14px; top: 64px; transform: rotate(-14deg);
  border: 3px solid var(--stamp); color: var(--stamp); border-radius: 8px;
  font-family: var(--font-display); font-size: 18px; padding: 4px 9px; line-height: 1.1; text-align: center;
  opacity: .9; animation: stamp .35s .35s cubic-bezier(.3,1.6,.5,1) both;
}
@keyframes stamp { from { transform: rotate(-14deg) scale(2.2); opacity: 0; } }
.actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; font-family: var(--font-body); }
.btn {
  appearance: none; border: 0; border-radius: 12px; padding: 14px 16px;
  font: 800 16px var(--font-body); cursor: pointer; text-align: center; text-decoration: none; display: block;
}
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.btn-cta { background: var(--stamp); color: #fff; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-sub { background: #eef0ee; color: var(--ink); }
.share-note { font: 600 12px var(--font-body); color: var(--ink-soft); text-align: center; min-height: 1em; margin: 2px 0 0; }
.share-text { width: 100%; box-sizing: border-box; font: 13px var(--font-body); border: 1px solid #d5d8d6; border-radius: 8px; padding: 8px; resize: none; -webkit-user-select: text; user-select: text; }

@media (prefers-reduced-motion: reduce) {
  .hint, .card, .stampmark { animation: none; }
}
</style>

<div class="app">
  <div class="title-row">
    <h1>영수증 뽑기</h1>
    <span class="best" id="best">내 최고 기록 —</span>
  </div>
  <div class="hud">
    <div class="hud-box" id="timeBox">
      <span class="hud-label">남은 시간</span>
      <span class="hud-val" id="time">10.0<small>초</small></span>
    </div>
    <div class="hud-box">
      <span class="hud-label">뽑은 길이</span>
      <span class="hud-val" id="dist">0.0<small>m</small></span>
    </div>
  </div>
  <div class="stage" id="stage" tabindex="0" aria-label="영수증을 아래로 끌어내리세요. 키보드는 아래 화살표 키">
    <canvas id="cv"></canvas>
    <div class="printer" id="printer"><span class="led"></span><span class="brand">MOMMOM POS</span></div>
    <div class="hint" id="hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15M5 12l7 7 7-7"/></svg>
      아래로 쭉쭉 내려서 뽑기
    </div>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-labelledby="cBig">
    <div class="c-head">10초 영수증 뽑기 기록</div>
    <hr class="dash">
    <div class="c-big" id="cBig">0.0<small>m</small></div>
    <div class="c-rank"><mark id="cRank">동네 마트 장보기</mark></div>
    <div class="stampmark">쿠폰<br>적용 ✓</div>
    <hr class="dash">
    <div class="row"><span>찍힌 품목</span><b id="cItems">0개</b></div>
    <div class="row"><span>적용된 쿠폰</span><b id="cCoupons">0장</b></div>
    <div class="row"><span>최고 기록</span><b id="cBest">0.0m</b></div>
    <hr class="dash">
    <div class="actions">
      <a class="btn btn-cta" id="cta" href="#" target="_blank" rel="noopener">롯데마트 쿠폰 받으러 가기</a>
      <div class="btn-row">
        <button class="btn btn-sub" id="again" type="button">다시 뽑기</button>
        <button class="btn btn-sub" id="share" type="button">기록 자랑하기</button>
      </div>
      <p class="share-note" id="shareNote"></p>
      <textarea class="share-text" id="shareText" rows="3" readonly hidden></textarea>
    </div>
  </div>
</div>

<script>
(() => {
  const GAME_MS = 10000;
  const CM_PER_PX = 0.1;          // 화면 1px = 영수증 0.1cm (재미용 과장)
  const LH = 26;                  // 영수증 한 줄 높이(px)
  const COUPON_URL = "#";         // 맘맘 앱 롯데마트 쿠폰 링크로 교체

  const ITEMS = [
    "기저귀 대형 팬티형", "유기농 우유 2.3L", "물티슈 캡형 10팩", "딸기 1팩", "떡뻥 쌀과자",
    "바나나 한 송이", "키즈 치약 딸기맛", "계란 30구", "조미김 16봉", "부드러운 두부",
    "플레인 요거트", "아기 세제 리필", "치즈 스틱", "냉동 볶음밥", "사과 주스 팩",
    "블록 장난감 세트", "어린이 비타민", "고구마 1kg", "아기 로션", "돈까스 반조각",
    "미역 국거리", "유아 식판", "생수 2L 6입", "귤 한 박스", "키즈 샴푸",
    "크레파스 24색", "소고기 다짐육", "애호박", "유아 숟가락", "주방세제"
  ];
  const QTY = ["1", "1", "1", "2", "1", "3", "1", "2"];

  const $ = id => document.getElementById(id);
  const stage = $("stage"), cv = $("cv"), ctx = cv.getContext("2d");
  const timeEl = $("time"), distEl = $("dist"), timeBox = $("timeBox");
  const hint = $("hint"), printer = $("printer"), sheet = $("sheet");

  let W = 0, H = 0, dpr = 1;
  let state = "ready";            // ready | playing | tearing | done
  let offset = 0, pulled = 0, vel = 0;
  let startAt = 0, lastT = 0, tearY = 0, tearV = 0;
  let best = 0;
  try { best = parseFloat(localStorage.getItem("receipt-best")) || 0; } catch (e) {}
  showBest();
  $("cta").href = COUPON_URL;

  function showBest() { $("best").textContent = best ? `내 최고 기록 ${best.toFixed(1)}m` : "내 최고 기록 —"; }

  function resize() {
    const r = stage.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    draw();
  }

  // 줄 내용: 0번 줄이 가장 먼저 인쇄되어 가장 아래로 내려간다
  function line(i) {
    if (i === 0) return { t: "head", a: "MOMMOM 장보기 영수증" };
    if (i === 1) return { t: "small", a: "아이랑 장보기 · 2026.10.26" };
    if (i === 2) return { t: "rule" };
    if (i % 13 === 0) return { t: "coupon", a: "★ 쿠폰 적용 ✓" };
    if (i % 31 === 0) return { t: "rule" };
    const h = (i * 2654435761) >>> 0;
    return { t: "item", a: ITEMS[h % ITEMS.length], b: QTY[(h >>> 8) % QTY.length] + "개" };
  }
  const linesOut = () => Math.max(0, Math.floor(offset / LH));
  const couponsOut = () => { let n = 0; for (let i = 13; i < linesOut(); i += 13) n++; return n; };

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const pw = Math.min(280, W * 0.8), px = (W - pw) / 2;
    const slotY = 50;
    const shift = tearY;                          // 찢어진 뒤 떨어지는 거리
    const paperTop = state === "tearing" || state === "done" ? slotY + shift : slotY;
    const paperBottom = slotY + offset + 24 + shift;
    if (paperBottom <= paperTop) return;

    ctx.save();
    ctx.beginPath(); ctx.rect(0, slotY, W, H - slotY); ctx.clip();

    // 종이
    ctx.shadowColor = "rgba(0,0,0,.12)"; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
    ctx.fillStyle = "#fffef9";
    const bottomEdge = Math.min(paperBottom, H + 40);
    ctx.beginPath();
    ctx.moveTo(px, paperTop);
    ctx.lineTo(px + pw, paperTop);
    ctx.lineTo(px + pw, bottomEdge);
    // 영수증 끝 톱니
    for (let x = px + pw; x > px; x -= 10) { ctx.lineTo(x - 5, bottomEdge + 6); ctx.lineTo(x - 10, bottomEdge); }
    ctx.closePath(); ctx.fill();
    ctx.shadowColor = "transparent";

    // 찢긴 윗변
    if (state === "tearing" || state === "done") {
      ctx.fillStyle = "#e3ece6";
      ctx.beginPath(); ctx.moveTo(px - 2, paperTop - 1);
      for (let x = px; x <= px + pw + 10; x += 9) ctx.lineTo(x, paperTop + ((x / 9) % 2 ? 6 : 0));
      ctx.lineTo(px + pw + 2, paperTop - 1); ctx.closePath(); ctx.fill();
    }

    // 글자
    ctx.textBaseline = "middle";
    const first = Math.max(0, Math.floor((offset - (H - slotY) + shift) / LH) - 1);
    const last = Math.floor((offset + 24) / LH) + 1;
    for (let i = first; i <= last; i++) {
      const y = slotY + offset + shift - i * LH - LH / 2 + 4;
      if (y < paperTop - LH || y > H + LH) continue;
      if (y < slotY) continue;
      const L = line(i);
      const lx = px + 16, rx = px + pw - 16;
      if (L.t === "head") {
        ctx.fillStyle = "#2b2f36"; ctx.font = "700 15px 'Nanum Gothic Coding', monospace"; ctx.textAlign = "center";
        ctx.fillText(L.a, W / 2, y);
      } else if (L.t === "small") {
        ctx.fillStyle = "#7b8189"; ctx.font = "400 12px 'Nanum Gothic Coding', monospace"; ctx.textAlign = "center";
        ctx.fillText(L.a, W / 2, y);
      } else if (L.t === "rule") {
        ctx.strokeStyle = "#c9ccd0"; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(lx, y); ctx.lineTo(rx, y); ctx.stroke(); ctx.setLineDash([]);
      } else if (L.t === "coupon") {
        ctx.fillStyle = "rgba(224,68,62,.1)"; ctx.fillRect(lx - 6, y - 10, pw - 20, 20);
        ctx.fillStyle = "#e0443e"; ctx.font = "700 14px 'Nanum Gothic Coding', monospace"; ctx.textAlign = "center";
        ctx.fillText(L.a, W / 2, y);
      } else {
        ctx.fillStyle = "#2b2f36"; ctx.font = "400 14px 'Nanum Gothic Coding', monospace";
        ctx.textAlign = "left"; ctx.fillText(L.a, lx, y);
        ctx.textAlign = "right"; ctx.fillText(L.b, rx, y);
      }
    }
    ctx.restore();
  }

  function hud() {
    const left = state === "ready" ? GAME_MS : Math.max(0, GAME_MS - (performance.now() - startAt));
    timeEl.innerHTML = (state === "done" || state === "tearing" ? "0.0" : (left / 1000).toFixed(1)) + "<small>초</small>";
    timeBox.classList.toggle("warn", state === "playing" && left < 3000);
    distEl.innerHTML = (pulled * CM_PER_PX / 100).toFixed(1) + "<small>m</small>";
  }

  function start() {
    state = "playing"; startAt = performance.now();
    hint.hidden = true; printer.classList.add("on");
  }

  function pull(px) {
    if (px <= 0) return;
    if (state === "ready") start();
    if (state !== "playing") return;
    offset += px; pulled += px;
  }

  function finish() {
    state = "tearing"; vel = 0; tearY = 0; tearV = 0;
    printer.classList.remove("on");
  }

  function rank(m) {
    if (m < 3) return "편의점 영수증";
    if (m < 8) return "동네 마트 장보기";
    if (m < 15) return "주말 대용량 장보기";
    if (m < 25) return "명절 장보기";
    if (m < 40) return "통큰 장보기";
    return "카트 세 대 장보기";
  }

  function showResult() {
    state = "done";
    const m = pulled * CM_PER_PX / 100;
    if (m > best) { best = m; try { localStorage.setItem("receipt-best", String(best)); } catch (e) {} }
    showBest();
    $("cBig").innerHTML = m.toFixed(1) + "<small>m</small>";
    $("cRank").textContent = rank(m);
    $("cItems").textContent = linesOut() + "개";
    $("cCoupons").textContent = couponsOut() + "장";
    $("cBest").textContent = best.toFixed(1) + "m";
    $("shareNote").textContent = "";
    $("shareText").hidden = true;
    sheet.hidden = false;
    $("again").focus({ preventScroll: true });
  }

  function reset() {
    state = "ready"; offset = 0; pulled = 0; vel = 0; tearY = 0;
    sheet.hidden = true; hint.hidden = false;
    hud(); draw(); stage.focus({ preventScroll: true });
  }

  function loop(t) {
    const dt = Math.min(50, t - (lastT || t)); lastT = t;
    if (state === "playing") {
      if (vel > 0.02) { pull(vel * dt); vel *= Math.pow(0.994, dt); } else vel = 0;
      if (t - startAt >= GAME_MS) finish();
    } else if (state === "tearing") {
      tearV += 0.004 * dt; tearY += tearV * dt;
      if (tearY > H + 40) showResult();
    }
    if (state !== "done") { hud(); draw(); }
    requestAnimationFrame(loop);
  }

  // 입력: 손가락/마우스 끌어내리기 + 휠 + 키보드
  let dragging = false, lastY = 0, lastMoveT = 0;
  stage.addEventListener("pointerdown", e => {
    if (state === "tearing" || state === "done") return;
    dragging = true; lastY = e.clientY; lastMoveT = performance.now(); vel = 0;
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener("pointermove", e => {
    if (!dragging) return;
    const now = performance.now(), dy = e.clientY - lastY;
    if (dy > 0) {
      pull(dy);
      const v = dy / Math.max(1, now - lastMoveT);
      vel = vel * 0.6 + v * 0.4;
    } else vel = 0;
    lastY = e.clientY; lastMoveT = now;
  });
  const endDrag = () => { if (performance.now() - lastMoveT > 80) vel = 0; dragging = false; };
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);
  stage.addEventListener("wheel", e => {
    e.preventDefault();
    const k = e.deltaMode === 1 ? 16 : 1;
    if (e.deltaY > 0) pull(Math.min(e.deltaY * k, 240));
  }, { passive: false });
  stage.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === " " || e.key === "PageDown") { e.preventDefault(); pull(36); }
  });
  document.addEventListener("touchmove", e => { if (sheet.hidden) e.preventDefault(); }, { passive: false });

  $("again").addEventListener("click", reset);
  $("share").addEventListener("click", async () => {
    const m = (pulled * CM_PER_PX / 100).toFixed(1);
    const text = `🧾 10초 영수증 뽑기 ${m}m! (${rank(+m)})\n나보다 길게 뽑을 수 있어? 롯데마트 쿠폰은 맘맘에서 받아가요`;
    const note = $("shareNote");
    try {
      if (navigator.share) { await navigator.share({ text }); note.textContent = "공유했어요"; return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(text); note.textContent = "기록 문구를 복사했어요. 붙여넣어 공유하세요"; return; } catch (e) {}
    const ta = $("shareText"); ta.value = text; ta.hidden = false; ta.select();
    note.textContent = "아래 문구를 복사해서 공유하세요";
  });

  window.addEventListener("resize", resize);
  (document.fonts ? document.fonts.load("14px 'Nanum Gothic Coding'") : Promise.resolve()).finally(() => { resize(); });
  resize(); hud();
  requestAnimationFrame(loop);
})();
</script>
